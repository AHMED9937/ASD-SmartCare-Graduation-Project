name: Flutter CI/CD

on:
  push:
    branches: [main, develop, feature/*, mlh-code-sample]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      deploy_to_firebase:
        description: 'Deploy to Firebase App Distribution'
        required: false
        default: false
        type: boolean

# Cancel in-progress runs on new pushes to the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.32.2'
  JAVA_VERSION: '17'

jobs:
  # =============================================================================
  # Code Quality: Format Check
  # =============================================================================
  format:
    name: Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Check formatting
        run: dart format --set-exit-if-changed .

  # =============================================================================
  # Code Quality: Static Analysis
  # =============================================================================
  analyze:
    name: Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

  # =============================================================================
  # Tests with Coverage
  # =============================================================================
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run tests with coverage
        run: flutter test --coverage --reporter=expanded

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false
        continue-on-error: true

  # =============================================================================
  # Build: Android Debug (PR verification)
  # =============================================================================
  build-android-debug:
    name: Build Android (debug)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [format, analyze, test]
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Android APK (debug)
        run: flutter build apk --debug

  # =============================================================================
  # Build: Android Release
  # =============================================================================
  build-android-release:
    name: Build Android (release)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [format, analyze, test]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # Decode keystore from secrets (if available)
      - name: Decode Keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

      # Create key.properties (if secrets available)
      - name: Create key.properties
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > android/key.properties << EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Build release APK
        run: flutter build apk --release
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}

      - name: Build release App Bundle
        run: flutter build appbundle --release
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

  # =============================================================================
  # Build: Web
  # =============================================================================
  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [format, analyze, test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build web
        run: flutter build web

  # =============================================================================
  # Deploy: Firebase App Distribution
  # =============================================================================
  deploy-firebase:
    name: Deploy to Firebase
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build-android-release]
    if: |
      (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy_to_firebase == 'true') ||
      startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: ./

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          groups: testers
          file: app-release.apk
          releaseNotes: |
            Build: ${{ github.run_number }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}

  # =============================================================================
  # Deploy: GitHub Releases (for tags)
  # =============================================================================
  deploy-github-release:
    name: GitHub Release (Tagged)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-android-release]
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: ./

      - name: Download AAB artifact
        uses: actions/download-artifact@v4
        with:
          name: release-aab
          path: ./

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            app-release.apk
            app-release.aab
          generate_release_notes: true
          draft: false
          prerelease: false

  # =============================================================================
  # Deploy: Automatic GitHub Releases (for main branch pushes)
  # Creates a release with timestamp/commit SHA for each push to main
  # =============================================================================
  deploy-auto-release:
    name: Auto Release (Main Branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-android-release]
    # Only run on main branch pushes (not PRs, not tags)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')

    permissions:
      contents: write

    steps:
      - name: Generate release info
        id: release_info
        run: |
          TIMESTAMP=$(date +'%Y%m%d-%H%M%S')
          SHORT_SHA=${GITHUB_SHA::7}
          echo "tag_name=build-${TIMESTAMP}-${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "release_name=Build ${TIMESTAMP} (${SHORT_SHA})" >> $GITHUB_OUTPUT

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: ./

      - name: Download AAB artifact
        uses: actions/download-artifact@v4
        with:
          name: release-aab
          path: ./

      - name: Rename artifacts with version info
        run: |
          mv app-release.apk ASD-SmartCare-${{ steps.release_info.outputs.tag_name }}.apk
          mv app-release.aab ASD-SmartCare-${{ steps.release_info.outputs.tag_name }}.aab

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: ${{ steps.release_info.outputs.release_name }}
          files: |
            ASD-SmartCare-${{ steps.release_info.outputs.tag_name }}.apk
            ASD-SmartCare-${{ steps.release_info.outputs.tag_name }}.aab
          body: |
            ## Automated Build Release
            
            **Branch:** main
            **Commit:** ${{ github.sha }}
            **Build Number:** ${{ github.run_number }}
            **Triggered by:** ${{ github.actor }}
            
            ### Downloads
            - **APK** - Direct install on Android devices
            - **AAB** - For Google Play Store upload
            
            ### Commit Message
            ${{ github.event.head_commit.message }}
          draft: false
          prerelease: true
          generate_release_notes: false

  # =============================================================================
  # CI Summary
  # =============================================================================
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [format, analyze, test, build-web]
    if: always()

    steps:
      - name: Check all jobs
        run: |
          if [[ "${{ needs.format.result }}" == "failure" ]] || \
             [[ "${{ needs.analyze.result }}" == "failure" ]] || \
             [[ "${{ needs.test.result }}" == "failure" ]] || \
             [[ "${{ needs.build-web.result }}" == "failure" ]]; then
            echo "❌ One or more CI jobs failed"
            exit 1
          fi
          echo "✅ All CI jobs passed"
